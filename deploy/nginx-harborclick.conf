server {
    server_name 142-93-242-85.nip.io 142.93.242.85;

    root /var/www/harborclick;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(wasm|pck)$ {
        try_files $uri =404;
        expires 1h;
    }

    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    ssl_certificate /etc/letsencrypt/live/142-93-242-85.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/142-93-242-85.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name 142-93-242-85.nip.io;

    return 301 https://$host$request_uri;
}

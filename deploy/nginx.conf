server {
    listen 80;
    root /srv/current;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm application/octet-stream image/svg+xml;

    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(wasm|pck)$ { try_files $uri =404; expires 1h; }
}

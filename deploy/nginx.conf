server {
    listen 80;
    root /srv/current;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm application/octet-stream image/svg+xml;

    # Every game file keeps its name across releases (index.pck, index.wasm,
    # index.js), so a cached copy is indistinguishable from a current one. The
    # old `expires 1h` kept players on the previous build for an hour after a
    # deploy. `no-cache` still lets the browser keep the file — it revalidates
    # with the ETag, and an unchanged 7 MB pack comes back as a 304.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
    location ~* \.(wasm|pck|js|html)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }
}
